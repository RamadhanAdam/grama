# Federated simulation configuration (custom loop, not FedAvg-shaped)

simulation:
  num_clients: 20
  clients_per_round: 10      # sampled without replacement each round
  num_rounds: 50
  local_epochs: 2
  local_batch_size: 32
  local_lr: 0.001
  non_iid_alpha: 0.5          # Dirichlet concentration; lower = more skewed (Sec 6.2.2)

aggregator:
  # Server-side latent density defense (Sec 5.3 / eq. 11-15)
  latent_dim: 2                 # dimensionality of phi(Δw_k) projection
  autoencoder_hidden: 32
  autoencoder_epochs: 10          # trained once per round on incoming Δw's, or reused/warm-started
  hdbscan:
    min_cluster_size: 3
    min_samples: 1
    cluster_selection_epsilon: 0.0
  # If HDBSCAN finds >1 non-noise cluster, the largest is treated as C_benign (eq. 13-15).

adversarial_eval:
  compromised_fractions: [0.10, 0.20, 0.30, 0.40]
  attack_types:
    - "label_flip"
    - "magnitude_poison"
  magnitude_poison_scale: 10.0
