# GAT + Mamba + classifier head configuration

graph:
  # Fixed ECU node vocabulary. Extend/replace with the actual ECU-to-CAN-ID
  # mapping once the real dataset's CAN ID set is known (Sec 3, Fig 1).
  ecu_nodes:
    - "ENGINE"
    - "TRANSMISSION"
    - "BRAKES"
    - "STEERING"
    - "ADAS"
    - "GATEWAY"
    - "INFOTAINMENT"
    - "BODY_CONTROL"
  # Edge construction: co-occurrence of two ECUs' CAN IDs within the same
  # sliding window forms an edge (Sec 4.1, Phase 1).
  edge_construction: "cooccurrence_window"

gat_encoder:
  in_features: 11        # dlc + 8 payload bytes + 2 derived (delta_t, freq) — adjust to real feature count
  hidden_features: 64
  out_features: 64        # d in Z_topo ∈ R^{W×d}
  num_heads: 4
  dropout: 0.1
  leaky_relu_slope: 0.2   # eq. 4-5
  activation: "elu"        # sigma in eq. 6

mamba_block:
  d_model: 64              # must match gat_encoder.out_features
  d_state: 16               # SSM state expansion factor (N in eq. 7-10)
  d_conv: 4                  # local conv width before selective scan
  expand: 2                   # inner expansion factor
  dt_rank: "auto"              # rank for Δ_t projection (eq. 9)
  backend: "auto"               # "cuda" | "torch" | "auto" (auto = try cuda, fall back to torch)

classifier_head:
  hidden_dim: 32
  num_classes: 5           # benign + 4 attack classes (multiclass); set to 2 for binary
  dropout: 0.1
