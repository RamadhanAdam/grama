# GAT + Mamba + classifier head, and the baselines (CNN-BiGRU, GCN, Transformer).
#
# Graph nodes are CAN IDs, learned from the data: CIC-IoV2024 does not
# publish which ECU sends which ID. Edges: see config/data.yaml build.edge_mode.
# in_features and num_classes are read from the built dataset at run time.

graph:
  synthetic_num_nodes: 12   # only for scripts/run_federated_train.py --synthetic

gat_encoder:
  in_features: 10         # 8 mean payload bytes + frame share + burst flag
  hidden_features: 64
  out_features: 64        # d in Z_topo ∈ R^{W×d}
  num_heads: 4
  dropout: 0.1
  leaky_relu_slope: 0.2   # eq. 4-5
  activation: "elu"       # sigma in eq. 6
  residual: true          # add W_res x_i to each layer (keeps a node's own signal on dense graphs)
  node_embedding_dim: 8   # learned embedding per CAN ID, appended to its features (0 = off)
  pooling: "attention"    # "attention" or "mean" over active nodes -> one token per window

mamba_block:
  d_model: 64             # must match gat_encoder.out_features
  d_state: 16             # SSM state size (N in eq. 7-10)
  d_conv: 4               # local conv width before the selective scan
  expand: 2               # inner expansion factor
  dt_rank: "auto"         # rank of the Δ_t projection (eq. 9)
  backend: "auto"         # "cuda" | "torch" | "auto" (cuda kernel if mamba-ssm is installed)
  temporal: "mamba"       # "mamba", or "gru" / "none" for the ablation

classifier_head:
  hidden_dim: 32
  num_classes: 6          # benign + DoS + 4 spoofing classes
  dropout: 0.1

baseline:                 # CNN-BiGRU (src/grama/models/baseline.py)
  id_dim: 16
  conv_channels: 64
  gru_hidden: 32
  head_hidden: 32
  dropout: 0.1

gcn_ids:                  # src/grama/models/baselines_extra.py; "temporal" is set by the model name
  hidden_features: 64     # (gcn_ids = last window only, gcn_gru = a GRU over the windows)
  id_dim: 8
  layers: 2
  dropout: 0.1
  head_hidden: 32

transformer_ids:          # frames of a window, then the windows of a sequence
  id_dim: 16
  d_model: 64
  heads: 4
  frame_layers: 1
  window_layers: 2
  ff_mult: 2
  dropout: 0.1
  head_hidden: 32
