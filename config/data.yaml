# CIC-IoV2024 data and preprocessing.
# Released schema: ID, DATA_0..DATA_7, label, category, specific_class.
# No timestamp and no DLC column, so features come from IDs and payload bytes only.

dataset:
  name: "CIC-IoV2024"
  raw_dir: "data/raw"            # put the download here (zip or CSVs, any folder depth)
  processed_dir: "data/processed"
  expected_columns: [ID, DATA_0, DATA_1, DATA_2, DATA_3, DATA_4, DATA_5, DATA_6, DATA_7,
                     label, category, specific_class]

# Class order = label index. File names are matched loosely
# (decimal_spoofing-GAS.csv -> spoofing-GAS). "Replay" from the concept note
# is not in the released data.
classes:
  - "benign"
  - "DoS"
  - "spoofing-GAS"
  - "spoofing-RPM"
  - "spoofing-SPEED"
  - "spoofing-STEERING_WHEEL"

build:
  window_size: 64        # W, CAN frames per window
  stride: 32             # step between windows (50% overlap)
  seq_len: 8             # L, windows per sequence fed to Mamba
  seq_stride: 2          # step between sequences, in windows
  # Train/test split, done per file before windowing, so no window crosses it.
  #   "blocks"   every fifth block of block_rows rows goes to test (default)
  #   "temporal" the last test_fraction of each file goes to test
  # CIC-IoV2024 files are a few frames repeated in long segments, and the RPM
  # and SPEED files end on CAN ID 513 with payloads found nowhere earlier. A
  # temporal split puts those segments only in test, so no model can learn
  # them: macro-F1 stops near 0.56 for every method. Blocks put every segment
  # in both splits.
  split: "blocks"
  block_rows: 1000
  test_fraction: 0.2
  max_nodes: 128         # CAN-ID vocabulary size, incl. one "other" node for rare/unseen IDs
  # Edges of the window graph (Sec 4.1, Phase 1):
  #   "transition"    i -- j when a frame of ID j directly follows one of ID i on the bus
  #   "cooccurrence"  i -- j when both IDs appear in the window (a complete graph over active IDs)
  # Both are built on the fly from the stored frames, so a run can switch
  # without rebuilding. The ablation compares them.
  edge_mode: "transition"
  min_attack_frames: 1   # attack frames needed for a window to count as an attack
  # Row caps per class, applied before the split. The benign file has 1.22M
  # rows against 184K attack rows in total. null = keep everything.
  max_rows_per_class:
    benign: 400000
  # The released attack files contain attack frames only, which makes the
  # task easy. With injection on, attack frames are interleaved with benign
  # frames from the same split, so attack windows look like a real injection.
  injection:
    enabled: false
    attack_ratio: 0.3
  synthetic_rows_per_class: 6000   # only for the synthetic smoke data

# Exact-duplicate removal is NOT applied. DoS and spoofing traffic is the same
# few frames repeated (spoofing-GAS: 9,991 rows, 2 distinct), so dropping
# duplicates erases the attacks. Leakage is handled by the time-based split.
