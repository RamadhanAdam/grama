# CIC-IoV2024 dataset & preprocessing configuration
# Real schema (UNB release): ID, DATA_0..DATA_7, label, category, specific_class
# No timestamp, no DLC field in the actual release.
# Dataset is 99.7% duplicates; dedup is CRITICAL before train/test split.

dataset:
  name: "CIC-IoV2024"
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  # Real column names as shipped by UNB
  expected_columns:
    - ID
    - DATA_0
    - DATA_1
    - DATA_2
    - DATA_3
    - DATA_4
    - DATA_5
    - DATA_6
    - DATA_7
    - label
    - category
    - specific_class

labels:
  benign: "benign"
  attack_classes:
    - "DoS"
    - "spoofing-GAS"
    - "spoofing-RPM"
    - "spoofing-SPEED"
    - "spoofing-STEERING_WHEEL"
  # Note: "Replay" was listed in concept note but does not exist in released data

sliding_window:
  window_size: 64      # W: number of CAN frames per window
  stride: 32            # overlap between consecutive windows
  # WARNING: The raw dataset is ~99.7% duplicates (per Stiawan et al., IJAIT 2024).
  # Deduplication MUST happen before windowing to avoid severe train/test leakage.

normalization:
  method: "min_max"     # eq. 3 in concept note
  payload_columns: ["DATA_0", "DATA_1", "DATA_2", "DATA_3", "DATA_4", "DATA_5", "DATA_6", "DATA_7"]
  clip_range: [0.0, 1.0]

split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  stratify_by_label: true
