# Experiment profiles. Pick one in GraMa.ipynb (PROFILE = "...") or run
# `make smoke`, `make quick` or `make full`.
#
# Every run is one federated training of one model with one aggregation rule,
# one Dirichlet alpha, one attack (or none) and one seed. Runs are saved to
# results/<profile>/runs.jsonl as they finish, and a run that is already
# there is skipped, so an interrupted profile picks up where it stopped.
#
# Method names are <model>_<aggregator>: models grama | cnn_bigru,
# aggregators hdbscan | fedavg | median | trimmed_mean | krum, or "central"
# for one model trained on all the data with the same budget (upper bound).
#
# Aggregators: fedavg | median | trimmed_mean | krum | norm_clip | flame | hdbscan (ours),
# foolsgold | deepsight | freqfed, and the hdbscan_* variants (robust.HDBSCAN_VARIANTS).
# Attacks: label_flip | targeted_flip | magnitude_poison | alie | alie_noisy | adaptive (Sec 6.2.3).
# A poisoning section may add seeds_by_fraction: {0.3: [0, 1, 2, 3, 4]} for more seeds in some cells.
#
# reuse_runs_from: other profiles whose finished runs this one may copy
# (same dataset file and federated setting only), so shared runs aren't
# trained twice.
# Ablation variants: no_residual | no_id_embedding | mean_pool |
# cooccurrence_edges | gru_instead_of_mamba | no_temporal (see runner.VARIANTS).

profiles:

  smoke:
    about: >-
      Synthetic CAN traffic and tiny runs. Checks that the whole pipeline works,
      in a few minutes on a CPU. The numbers mean nothing.
    data: synthetic
    data_overrides: {max_rows_per_class: null, synthetic_rows_per_class: 12000}
    federated: {num_clients: 8, clients_per_round: 6, num_rounds: 6, local_epochs: 3}
    eval_every: 1
    seeds: [0]
    main:
      methods: [grama_hdbscan, grama_fedavg, cnn_bigru_fedavg, grama_central, gcn_ids_fedavg, gcn_gru_fedavg,
                transformer_ids_fedavg]
    noniid:
      alphas: [0.1, 100.0]
      aggregators: [hdbscan]
    poisoning:
      attacks: [magnitude_poison, alie]
      fractions: [0.25]
      aggregators: [fedavg, norm_clip, flame, hdbscan]
    ablation:
      aggregator: fedavg
      variants: [no_residual, cooccurrence_edges, no_temporal]

  quick:
    about: >-
      Real data with the benign file capped at 150K rows, 10 clients, 15 rounds,
      2 local epochs, one seed. About 1.5 hours on an A100. About 20-40 minutes on a GPU. Good for a first look and for
      tuning before the full run.
    data: real
    data_overrides: {max_rows_per_class: {benign: 150000}}
    federated: {num_clients: 10, clients_per_round: 5, num_rounds: 15, local_epochs: 2}
    eval_every: 2
    seeds: [0]
    main:
      methods: [grama_hdbscan, grama_fedavg, cnn_bigru_fedavg, grama_central]
    noniid:
      alphas: [0.1, 0.5, 1.0, 100.0]
      aggregators: [hdbscan, fedavg]
    poisoning:
      attacks: [label_flip, targeted_flip, magnitude_poison, alie]
      fractions: [0.2, 0.4]
      aggregators: [fedavg, median, trimmed_mean, krum, norm_clip, flame, hdbscan]
    ablation:
      aggregator: fedavg
      variants: [no_residual, no_id_embedding, mean_pool, cooccurrence_edges, gru_instead_of_mamba, no_temporal]

  full:
    about: >-
      The paper setting: 20 clients, 10 per round, 30 rounds, 2 local epochs,
      three seeds for the main, non-IID and ablation results, two for the
      attack grid. About 10-14 hours on one A100; run it from a terminal
      with nohup (see the README).
    data: real
    data_overrides: {}
    federated: {num_clients: 20, clients_per_round: 10, num_rounds: 30, local_epochs: 2, local_batch_size: 64}
    eval_every: 5
    seeds: [0, 1, 2]
    main:
      methods: [grama_hdbscan, grama_fedavg, cnn_bigru_fedavg, cnn_bigru_hdbscan, grama_central]
    noniid:
      alphas: [0.05, 0.1, 0.5, 1.0, 100.0]
      aggregators: [hdbscan, fedavg]
    poisoning:
      seeds: [0, 1]
      attacks: [label_flip, targeted_flip, magnitude_poison, alie]
      fractions: [0.1, 0.2, 0.3, 0.4]
      aggregators: [fedavg, median, trimmed_mean, krum, norm_clip, flame, hdbscan]
    ablation:
      aggregator: fedavg
      variants: [no_residual, no_id_embedding, mean_pool, cooccurrence_edges, gru_instead_of_mamba, no_temporal]

  # ------------------------------------------------------------------ other datasets
  # The `full` setting on two more datasets (config/data.yaml has their
  # folders and splits). Fewer runs than on CIC-IoV2024: no non-IID sweep
  # and no ablation, and only the two attacks that did the most damage there
  # (targeted flipping and ALIE). Every run is also tested on the dataset's
  # extra test sets (the "Other test sets" table of the report).

  road:
    about: >-
      ROAD: one car, attacks injected for real, masquerade versions, split by
      recording. Main comparison with five seeds; targeted flipping and ALIE
      at 20% and 40% with two seeds. About 60 runs. ROAD has about four times
      as many training sequences as CIC-IoV2024, so allow 9-11 hours on one A100.
    data: road
    data_overrides: {}
    federated: &paper_federated {num_clients: 20, clients_per_round: 10, num_rounds: 30, local_epochs: 2, local_batch_size: 64}
    eval_every: 5
    seeds: [0, 1, 2]
    main:
      # Two more seeds than the other profiles: ROAD's clean results vary a lot between seeds.
      seeds: [0, 1, 2, 3, 4]
      methods: &paper_methods [grama_hdbscan, grama_fedavg, cnn_bigru_fedavg, cnn_bigru_hdbscan, grama_central]
    poisoning: &short_poisoning
      seeds: [0, 1]
      attacks: [targeted_flip, alie]
      fractions: [0.2, 0.4]
      aggregators: [fedavg, norm_clip, flame, hdbscan]

  cantt1:
    about: >-
      can-train-and-test, set_01: trains on a Chevrolet Impala; tests on the
      Impala (known attacks, then unknown attacks) and on a Chevrolet Silverado.
      Binary (benign or attack). Same runs as the road profile, about 60;
      about 4 hours on one A100.
    data: can_train_test
    data_overrides: {set: set_01}
    federated: *paper_federated
    eval_every: 5
    seeds: [0, 1, 2]
    main:
      seeds: [0, 1, 2, 3, 4]   # two more seeds, as on ROAD
      methods: *paper_methods
    poisoning: *short_poisoning

  cantt2:
    about: >-
      can-train-and-test, set_02: trains on a Chevrolet Traverse, unknown car
      Subaru Forester. Main comparison only, three seeds (15 runs).
    data: can_train_test
    data_overrides: {set: set_02}
    federated: *paper_federated
    eval_every: 5
    seeds: [0, 1, 2]
    main: {methods: *paper_methods}

  cantt3:
    about: >-
      can-train-and-test, set_03: trains on a Chevrolet Silverado, unknown car
      Subaru Forester. Main comparison only, three seeds (15 runs).
    data: can_train_test
    data_overrides: {set: set_03}
    federated: *paper_federated
    eval_every: 5
    seeds: [0, 1, 2]
    main: {methods: *paper_methods}

  cantt4:
    about: >-
      can-train-and-test, set_04: trains on a Subaru Forester, unknown car
      Chevrolet Traverse. Main comparison only, three seeds (15 runs).
    data: can_train_test
    data_overrides: {set: set_04}
    federated: *paper_federated
    eval_every: 5
    seeds: [0, 1, 2]
    main: {methods: *paper_methods}

  # ------------------------------------------------------------------ adaptive attack
  # An attacker who knows the defence: each round it sends the strongest
  # targeted poison the aggregation rule still accepts (attacks/poisoning.py).
  # The 0% reference runs are copied from the profile with the same data.

  cic_adaptive:
    about: >-
      Adaptive attack on CIC-IoV2024 (same data and setting as `full`): 20% and
      40% of clients, FedAvg, norm clipping, FLAME and HDBSCAN, two seeds
      (16 runs). About an hour on one A100.
    data: real
    data_overrides: {}
    federated: *paper_federated
    eval_every: 5
    seeds: [0, 1]
    reuse_runs_from: [full]
    poisoning: &adaptive_poisoning
      seeds: [0, 1]
      attacks: [adaptive]
      fractions: [0.2, 0.4]
      aggregators: [fedavg, norm_clip, flame, hdbscan]

  cantt1_adaptive:
    about: >-
      Adaptive attack on can-train-and-test set_01 (same data and setting as
      `cantt1`), same grid as cic_adaptive (16 runs). About 1.5 hours on one A100.
    data: can_train_test
    data_overrides: {set: set_01}
    federated: *paper_federated
    eval_every: 5
    seeds: [0, 1]
    reuse_runs_from: [cantt1]
    poisoning: *adaptive_poisoning

  # ------------------------------------------------------------------ the defence paper
  # Runs for the paper on the defence (the density rule on the latent space of the updates).
  # All on CIC-IoV2024 at the `full` setting unless the name says otherwise; each profile
  # copies the runs it shares with `full` and with earlier profiles. `scripts/run_queue.sh`
  # runs them in order of importance.

  new_baselines:
    about: >-
      FoolsGold, DeepSight (simplified) and FreqFed on the grid of `full`: four attacks,
      20/30/40% of clients, three seeds (five at 30% and 40%). About 170 runs.
    data: real
    data_overrides: {}
    federated: *paper_federated
    eval_every: 5
    seeds: [0, 1, 2]
    reuse_runs_from: [full]
    poisoning:
      seeds: [0, 1, 2]
      seeds_by_fraction: {0.3: [0, 1, 2, 3, 4], 0.4: [0, 1, 2, 3, 4]}
      attacks: [label_flip, targeted_flip, magnitude_poison, alie]
      fractions: [0.2, 0.3, 0.4]
      aggregators: [foolsgold, deepsight, freqfed]

  def_ablation:
    about: >-
      What each part of the defence contributes: the autoencoder against PCA and against
      clustering the raw updates, with and without the rescaling of the updates and of the
      latent space, and the last layer only. Targeted flipping and ALIE at 20% and 40%,
      three seeds. About 100 runs.
    data: real
    data_overrides: {}
    federated: *paper_federated
    eval_every: 5
    seeds: [0, 1, 2]
    reuse_runs_from: [full]
    poisoning:
      seeds: [0, 1, 2]
      attacks: [targeted_flip, alie]
      fractions: [0.2, 0.4]
      aggregators: [hdbscan, hdbscan_pca, hdbscan_raw, hdbscan_no_rescale, hdbscan_no_normalize,
                    hdbscan_no_standardize, hdbscan_last_layer]

  cic_seeds:
    about: >-
      The grid of `full` with at least three seeds in every cell and five seeds at 30% and 40%
      of compromised clients. About 250 new runs.
    data: real
    data_overrides: {}
    federated: *paper_federated
    eval_every: 5
    seeds: [0, 1, 2]
    reuse_runs_from: [full]
    poisoning:
      seeds: [0, 1, 2]
      seeds_by_fraction: {0.3: [0, 1, 2, 3, 4], 0.4: [0, 1, 2, 3, 4]}
      attacks: [label_flip, targeted_flip, magnitude_poison, alie]
      fractions: [0.1, 0.2, 0.3, 0.4]
      aggregators: [fedavg, median, trimmed_mean, krum, norm_clip, flame, hdbscan]

  def_grid:
    about: >-
      Sensitivity of the defence to its two clustering settings: the cluster selection
      epsilon (1, 2, 4, 8) and the smallest cluster size (2, 3, 5). Targeted flipping and ALIE
      at 20% and 40%, three seeds. About 90 runs.
    data: real
    data_overrides: {}
    federated: *paper_federated
    eval_every: 5
    seeds: [0, 1, 2]
    reuse_runs_from: [full, def_ablation]
    poisoning:
      seeds: [0, 1, 2]
      attacks: [targeted_flip, alie]
      fractions: [0.2, 0.4]
      aggregators: [hdbscan, hdbscan_eps1, hdbscan_eps4, hdbscan_eps8, hdbscan_mcs2, hdbscan_mcs5]

  alie_duplicates:
    about: >-
      Does the defence only catch ALIE because the colluders send identical vectors? The same
      attack with noise added by each colluder (alie_noisy), against the rules that matter.
      20% and 40%, three seeds. About 45 runs.
    data: real
    data_overrides: {}
    federated: *paper_federated
    eval_every: 5
    seeds: [0, 1, 2]
    reuse_runs_from: [full, new_baselines, cic_seeds]
    poisoning:
      seeds: [0, 1, 2]
      attacks: [alie, alie_noisy]
      fractions: [0.2, 0.4]
      aggregators: [fedavg, norm_clip, flame, foolsgold, hdbscan]

  clients40:
    about: >-
      The same comparison with 40 clients, 20 per round, so the clustering sees twice as many
      updates. Targeted flipping and ALIE at 20% and 40%, three seeds. About 60 runs, each
      about twice as long as a run of `full`.
    data: real
    data_overrides: {}
    federated: {num_clients: 40, clients_per_round: 20, num_rounds: 30, local_epochs: 2, local_batch_size: 64}
    eval_every: 5
    seeds: [0, 1, 2]
    poisoning:
      seeds: [0, 1, 2]
      attacks: [targeted_flip, alie]
      fractions: [0.2, 0.4]
      aggregators: [fedavg, norm_clip, flame, hdbscan]

  cic_adaptive_new:
    about: >-
      The adaptive attack against FoolsGold, DeepSight and FreqFed, same grid as cic_adaptive
      (18 runs).
    data: real
    data_overrides: {}
    federated: *paper_federated
    eval_every: 5
    seeds: [0, 1]
    reuse_runs_from: [full, new_baselines]
    poisoning:
      seeds: [0, 1]
      attacks: [adaptive]
      fractions: [0.2, 0.4]
      aggregators: [foolsgold, deepsight, freqfed]

  road_new_baselines:
    about: >-
      FoolsGold, DeepSight and FreqFed on ROAD, same grid as `road` (30 runs).
    data: road
    data_overrides: {}
    federated: *paper_federated
    eval_every: 5
    seeds: [0, 1]
    reuse_runs_from: [road]
    poisoning:
      seeds: [0, 1]
      attacks: [targeted_flip, alie]
      fractions: [0.2, 0.4]
      aggregators: [foolsgold, deepsight, freqfed]

  cantt1_new_baselines:
    about: >-
      FoolsGold, DeepSight and FreqFed on can-train-and-test set_01, same grid as `cantt1` (30 runs).
    data: can_train_test
    data_overrides: {set: set_01}
    federated: *paper_federated
    eval_every: 5
    seeds: [0, 1]
    reuse_runs_from: [cantt1]
    poisoning:
      seeds: [0, 1]
      attacks: [targeted_flip, alie]
      fractions: [0.2, 0.4]
      aggregators: [foolsgold, deepsight, freqfed]
