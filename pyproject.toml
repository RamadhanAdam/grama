[project]
name = "grama"
version = "0.1.0"
description = "GraMa: Graph-Mamba Federated IDS for CAN-bus / IoV, with HDBSCAN latent-density aggregation defense"
authors = [{ name = "Ramadhan Adam Zome" }]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

dependencies = [
    "torch>=2.4.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",   # sklearn.cluster.HDBSCAN, metrics
    "scipy>=1.12",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Only installable on a CUDA-capable machine with matching toolkit (e.g. Kinesis Network A100 node).
# Do NOT put this in the base deps — it will break CPU/dev installs.
cuda = [
    "mamba-ssm>=2.2.2",
    "causal-conv1d>=1.4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
