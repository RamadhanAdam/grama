[project]
name = "grama"
version = "0.2.0"
description = "GraMa: graph attention + Mamba federated intrusion detection for in-vehicle CAN traffic, with an HDBSCAN defence against poisoned clients"
authors = [{ name = "Ramadhan Adam Zome" }]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",   # sklearn.cluster.HDBSCAN, metrics
    "scipy>=1.10",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Only builds on a CUDA machine with a matching toolkit. Optional: without it the
# Mamba block uses its pure-PyTorch version, which is fast enough for L = 8.
cuda = [
    "mamba-ssm>=2.2.2",
    "causal-conv1d>=1.4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
